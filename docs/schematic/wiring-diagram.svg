<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455A64"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="880" y="42" text-anchor="middle" font-size="28" font-weight="bold" fill="#155E75">Radiant Cooling System — ESP32 Wiring Diagram (38-pin)</text>
  <text x="880" y="66" text-anchor="middle" font-size="14" fill="#546E7A">Pin numbers match each sketch's PINS_CONFIG.h · all boards on the same Wi-Fi channel for ESP-NOW</text>

  <!-- ===================== GATEWAY ===================== -->
  <g id="gateway">
    <rect x="660" y="200" width="420" height="380" rx="12" fill="#E8F1F8" stroke="#2C7DA0" stroke-width="2"/>
    <rect x="660" y="200" width="420" height="52" rx="12" fill="#2C7DA0"/>
    <rect x="660" y="226" width="420" height="26" fill="#2C7DA0"/>
    <text x="870" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">RadiantCoolingMonitor — GATEWAY</text>
    <text x="870" y="284" text-anchor="middle" font-size="13" fill="#155E75">GPIO 18 · 1-Wire bus (6× DS18B20) — pull-up 4.7 kΩ</text>
    <text x="870" y="352" text-anchor="middle" font-size="13" fill="#155E75">GPIO 33 · WiFi reset button (to GND, hold 3 s)</text>
    <text x="870" y="420" text-anchor="middle" font-size="13" fill="#155E75">SYSTEM_ID = RADIANT-001 · WeatherAPI: Manila</text>
    <text x="870" y="488" text-anchor="middle" font-size="13" fill="#155E75">Wi-Fi → Firebase RTDB (radiant/…) · ESP-NOW to peers</text>

    <!-- 1-Wire bus + 6 sensors -->
    <line x1="870" y1="200" x2="870" y2="160" stroke="#1F4E79" stroke-width="2"/>
    <line x1="665" y1="160" x2="1067" y2="160" stroke="#1F4E79" stroke-width="2"/>
    <g id="sensors" font-size="11" fill="#1B5E20">
      <!-- Supply -->
      <rect x="665" y="90" width="62" height="50" rx="6" fill="#E8F8E8" stroke="#2E7D32" stroke-width="1.5"/>
      <text x="696" y="110" text-anchor="middle">DS18B20</text><text x="696" y="128" text-anchor="middle" font-weight="bold">Supply</text>
      <line x1="696" y1="140" x2="696" y2="160" stroke="#1F4E79" stroke-width="2"/>
      <!-- Return -->
      <rect x="733" y="90" width="62" height="50" rx="6" fill="#E8F8E8" stroke="#2E7D32" stroke-width="1.5"/>
      <text x="764" y="110" text-anchor="middle">DS18B20</text><text x="764" y="128" text-anchor="middle" font-weight="bold">Return</text>
      <line x1="764" y1="140" x2="764" y2="160" stroke="#1F4E79" stroke-width="2"/>
      <!-- Pipe 1 -->
      <rect x="801" y="90" width="62" height="50" rx="6" fill="#E8F8E8" stroke="#2E7D32" stroke-width="1.5"/>
      <text x="832" y="110" text-anchor="middle">DS18B20</text><text x="832" y="128" text-anchor="middle" font-weight="bold">Pipe 1</text>
      <line x1="832" y1="140" x2="832" y2="160" stroke="#1F4E79" stroke-width="2"/>
      <!-- Pipe 2 -->
      <rect x="869" y="90" width="62" height="50" rx="6" fill="#E8F8E8" stroke="#2E7D32" stroke-width="1.5"/>
      <text x="900" y="110" text-anchor="middle">DS18B20</text><text x="900" y="128" text-anchor="middle" font-weight="bold">Pipe 2</text>
      <line x1="900" y1="140" x2="900" y2="160" stroke="#1F4E79" stroke-width="2"/>
      <!-- Pipe 3 -->
      <rect x="937" y="90" width="62" height="50" rx="6" fill="#E8F8E8" stroke="#2E7D32" stroke-width="1.5"/>
      <text x="968" y="110" text-anchor="middle">DS18B20</text><text x="968" y="128" text-anchor="middle" font-weight="bold">Pipe 3</text>
      <line x1="968" y1="140" x2="968" y2="160" stroke="#1F4E79" stroke-width="2"/>
      <!-- Pipe 4 -->
      <rect x="1005" y="90" width="62" height="50" rx="6" fill="#E8F8E8" stroke="#2E7D32" stroke-width="1.5"/>
      <text x="1036" y="110" text-anchor="middle">DS18B20</text><text x="1036" y="128" text-anchor="middle" font-weight="bold">Pipe 4</text>
      <line x1="1036" y1="140" x2="1036" y2="160" stroke="#1F4E79" stroke-width="2"/>
    </g>
    <!-- 4.7k pull-up -->
    <polyline points="1067,160 1095,160 1100,150 1108,170 1116,150 1124,170 1132,150 1140,160 1148,160"
              fill="none" stroke="#C62828" stroke-width="2"/>
    <line x1="1148" y1="160" x2="1175" y2="160" stroke="#C62828" stroke-width="2"/>
    <line x1="1175" y1="160" x2="1175" y2="125" stroke="#C62828" stroke-width="2"/>
    <text x="1175" y="115" text-anchor="middle" font-size="12" fill="#C62828">3V3</text>
    <text x="1108" y="148" font-size="11" fill="#C62828">4.7 kΩ</text>

    <!-- WiFi reset button -->
    <line x1="820" y1="580" x2="820" y2="640" stroke="#455A64" stroke-width="2" marker-end="url(#arrG)"/>
    <rect x="760" y="640" width="120" height="42" rx="6" fill="#ECEFF1" stroke="#455A64" stroke-width="1.5"/>
    <text x="820" y="666" text-anchor="middle" font-size="12" fill="#37474F">SW · WiFi reset</text>
    <line x1="820" y1="682" x2="820" y2="712" stroke="#455A64" stroke-width="2"/>
    <text x="820" y="728" text-anchor="middle" font-size="12" fill="#455A64">GND</text>
    <text x="890" y="660" font-size="11" fill="#455A64">GPIO 33</text>
  </g>

  <!-- ===================== CHILLER ===================== -->
  <g id="chiller">
    <rect x="40" y="200" width="420" height="380" rx="12" fill="#E8F1F8" stroke="#2C7DA0" stroke-width="2"/>
    <rect x="40" y="200" width="420" height="52" rx="12" fill="#2C7DA0"/>
    <rect x="40" y="226" width="420" height="26" fill="#2C7DA0"/>
    <text x="250" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">WaterChillerController — CHILLER</text>
    <text x="250" y="284" text-anchor="middle" font-size="13" fill="#155E75">GPIO 22 · 1-Wire (DS18B20 water temp) — 4.7 kΩ</text>
    <text x="250" y="352" text-anchor="middle" font-size="13" fill="#155E75">GPIO 19 · SSR 1 → water pump 1</text>
    <text x="250" y="420" text-anchor="middle" font-size="13" fill="#155E75">GPIO 21 · SSR 2 → water pump 2</text>
    <text x="250" y="488" text-anchor="middle" font-size="13" fill="#155E75">Pumps on/off commanded by the gateway (ESP-NOW)</text>

    <!-- water temp sensor -->
    <rect x="205" y="90" width="90" height="50" rx="6" fill="#E8F8E8" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="250" y="110" text-anchor="middle" font-size="11">DS18B20</text>
    <text x="250" y="128" text-anchor="middle" font-size="11" font-weight="bold">Water temp</text>
    <line x1="250" y1="200" x2="250" y2="140" stroke="#1F4E79" stroke-width="2"/>
    <polyline points="250,163 278,163 283,153 291,173 299,153 307,163 315,163" fill="none" stroke="#C62828" stroke-width="2"/>
    <text x="283" y="152" font-size="11" fill="#C62828">4.7 kΩ</text>
    <line x1="315" y1="163" x2="340" y2="163" stroke="#C62828" stroke-width="2"/>
    <text x="346" y="167" font-size="12" fill="#C62828">3V3</text>

    <!-- pump 1 -->
    <line x1="170" y1="580" x2="170" y2="660" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="120" y="660" width="100" height="50" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="170" y="685" text-anchor="middle" font-size="12" fill="#BF360C">SSR 1</text>
    <text x="170" y="702" text-anchor="middle" font-size="10" fill="#BF360C">GPIO 19</text>
    <text x="75" y="688" text-anchor="middle" font-size="11" fill="#C62828">~AC</text>
    <line x1="95" y1="685" x2="120" y2="685" stroke="#C62828" stroke-width="2"/>
    <line x1="220" y1="685" x2="274" y2="685" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="300" cy="685" r="26" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
    <text x="300" y="682" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A148C">Pump 1</text>
    <text x="300" y="726" text-anchor="middle" font-size="11" fill="#6A1B9A">(AC load)</text>

    <!-- pump 2 -->
    <line x1="260" y1="580" x2="260" y2="770" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="120" y="770" width="100" height="50" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="170" y="795" text-anchor="middle" font-size="12" fill="#BF360C">SSR 2</text>
    <text x="170" y="812" text-anchor="middle" font-size="10" fill="#BF360C">GPIO 21</text>
    <text x="75" y="798" text-anchor="middle" font-size="11" fill="#C62828">~AC</text>
    <line x1="95" y1="795" x2="120" y2="795" stroke="#C62828" stroke-width="2"/>
    <line x1="220" y1="795" x2="274" y2="795" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="300" cy="795" r="26" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
    <text x="300" y="792" text-anchor="middle" font-size="11" font-weight="bold" fill="#4A148C">Pump 2</text>
    <text x="300" y="836" text-anchor="middle" font-size="11" fill="#6A1B9A">(AC load)</text>
  </g>

  <!-- ===================== DEHUMIDIFIER ===================== -->
  <g id="dh">
    <rect x="1280" y="200" width="420" height="380" rx="12" fill="#E8F1F8" stroke="#2C7DA0" stroke-width="2"/>
    <rect x="1280" y="200" width="420" height="52" rx="12" fill="#2C7DA0"/>
    <rect x="1280" y="226" width="420" height="26" fill="#2C7DA0"/>
    <text x="1490" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">DehumidifierController — DEHUMIDIFIER</text>
    <text x="1490" y="284" text-anchor="middle" font-size="13" fill="#155E75">GPIO 32 · DHT22 (indoor temp + RH) — 10 kΩ</text>
    <text x="1490" y="352" text-anchor="middle" font-size="13" fill="#155E75">GPIO 23 · SSR → dehumidifier</text>
    <text x="1490" y="420" text-anchor="middle" font-size="13" fill="#155E75">Holds RH at 55% setpoint (hysteresis)</text>
    <text x="1490" y="488" text-anchor="middle" font-size="13" fill="#155E75">Config/setpoint comes from the gateway</text>

    <!-- DHT22 -->
    <rect x="1445" y="90" width="90" height="50" rx="6" fill="#E8F8E8" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="1490" y="110" text-anchor="middle" font-size="11">DHT22</text>
    <text x="1490" y="128" text-anchor="middle" font-size="11" font-weight="bold">Temp + RH</text>
    <line x1="1490" y1="200" x2="1490" y2="140" stroke="#1F4E79" stroke-width="2"/>
    <polyline points="1490,163 1518,163 1523,153 1531,173 1539,153 1547,163 1555,163" fill="none" stroke="#C62828" stroke-width="2"/>
    <text x="1523" y="152" font-size="11" fill="#C62828">10 kΩ</text>
    <line x1="1555" y1="163" x2="1580" y2="163" stroke="#C62828" stroke-width="2"/>
    <text x="1586" y="167" font-size="12" fill="#C62828">3V3</text>

    <!-- dehumidifier SSR + load -->
    <line x1="1430" y1="580" x2="1430" y2="700" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="1370" y="700" width="120" height="50" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
    <text x="1430" y="725" text-anchor="middle" font-size="12" fill="#BF360C">SSR</text>
    <text x="1430" y="742" text-anchor="middle" font-size="10" fill="#BF360C">GPIO 23</text>
    <text x="1325" y="728" text-anchor="middle" font-size="11" fill="#C62828">~AC</text>
    <line x1="1345" y1="725" x2="1370" y2="725" stroke="#C62828" stroke-width="2"/>
    <line x1="1490" y1="725" x2="1524" y2="725" stroke="#1F4E79" stroke-width="2"/>
    <circle cx="1550" cy="725" r="26" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
    <text x="1550" y="722" text-anchor="middle" font-size="10" font-weight="bold" fill="#4A148C">Dehumid.</text>
    <text x="1550" y="766" text-anchor="middle" font-size="11" fill="#6A1B9A">(AC load)</text>
  </g>

  <!-- ===================== ESP-NOW ===================== -->
  <line x1="460" y1="390" x2="660" y2="390" stroke="#455A64" stroke-width="2.5" stroke-dasharray="8,5" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="560" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#455A64">ESP-NOW</text>
  <line x1="1080" y1="390" x2="1280" y2="390" stroke="#455A64" stroke-width="2.5" stroke-dasharray="8,5" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="1180" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#455A64">ESP-NOW</text>

  <!-- ===================== POWER & NOTES ===================== -->
  <rect x="30" y="880" width="1700" height="180" rx="14" fill="#F5F7F9" stroke="#B0BEC5" stroke-width="1.5"/>
  <text x="60" y="912" font-size="17" font-weight="bold" fill="#155E75">Power &amp; wiring notes</text>
  <text x="60" y="944" font-size="13.5" fill="#37474F">• Each board is powered via USB 5 V (onboard 3V3 regulator). Sensors run at 3V3 and all boards share GND.</text>
  <text x="60" y="972" font-size="13.5" fill="#37474F">• 1-Wire (DS18B20): 4.7 kΩ pull-up from the data line to 3V3 — monitor has 6 sensors, chiller has 1.</text>
  <text x="60" y="1000" font-size="13.5" fill="#37474F">• DHT22: 10 kΩ pull-up from the data pin to 3V3 (powered at 3V3).</text>
  <text x="60" y="1028" font-size="13.5" fill="#37474F">• SSRs: GPIO 3.3 V drives the module input (3–32 V DC); the ~AC side switches the pumps / dehumidifier — keep mains wiring isolated.</text>
  <text x="60" y="1056" font-size="13.5" fill="#37474F">• ESP-NOW: all three boards must be on the same Wi-Fi channel (gateway joins the router; peers sit on the router's channel).</text>
</svg>
